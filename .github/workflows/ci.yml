---
name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

env:
  ROLE_NAME: ${{ github.event.repository.name }}
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: ${{ env.ROLE_NAME }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: uv sync --groups dev
        working-directory: ${{ env.ROLE_NAME }}

      - name: Run yamllint
        run: uv run yamllint .
        working-directory: ${{ env.ROLE_NAME }}

      - name: Run ansible-lint
        run: uv run ansible-lint
        working-directory: ${{ env.ROLE_NAME }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - "debian13"
          - "rockylinux9"
          - "ubuntu2404"
        ansible-version:
          - "2.20"
        python-version:
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: ${{ env.ROLE_NAME }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          uv sync \
            --groups dev \
            --python python${{ matrix.python-version }} \
            --upgrade-package "ansible-core==${{ matrix.ansible-version }}.*"
        working-directory: ${{ env.ROLE_NAME }}

      - name: Run tests
        run: uv run molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
        working-directory: ${{ env.ROLE_NAME }}
