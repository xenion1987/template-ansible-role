---
name: Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine bump type
        id: bump_type
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -qiE '^major:'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qiE '^feat:'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qiE '^fix:'; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate new version
        if: steps.bump_type.outputs.bump != 'none'
        id: new_version
        working-directory: ${{ github.event.repository.name }}
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          LATEST_TAG="${LATEST_TAG:-0.0.0}"
          LATEST_TAG="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG}"
          case "${{ steps.bump_type.outputs.bump }}" in
            major) echo "version=v$((MAJOR + 1)).0.0" >> "$GITHUB_OUTPUT" ;;
            minor) echo "version=v${MAJOR}.$((MINOR + 1)).0" >> "$GITHUB_OUTPUT" ;;
            patch) echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create release
        if: steps.bump_type.outputs.bump != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.new_version.outputs.version }}
          generate_release_notes: true
          make_latest: true

      ### DEFAULT GALAXY IMPORT (uses GitHub owner as namespace)
      # - name: Import role to Ansible Galaxy
      #   if: steps.bump_type.outputs.bump != 'none' && secrets.GALAXY_API_KEY != ''
      #   run: |
      #     uv run ansible-galaxy role import \
      #       --token "${{ secrets.GALAXY_API_KEY }}" \
      #       "${{ github.repository_owner }}" \
      #       "${{ github.event.repository.name }}"

      ### ALTERNATE GALAXY IMPORT (uses configurable namespace)
      - name: Import role to Ansible Galaxy with alternate namespace
        if: steps.bump_type.outputs.bump != 'none' && env.GALAXY_API_KEY != ''
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
          GALAXY_NAMESPACE: ${{ vars.GALAXY_NAMESPACE || github.repository_owner }}
        run: |
          curl -sS -X POST "https://galaxy.ansible.com/api/v1/imports/" \
            -H "Authorization: token ${GALAXY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "alternate_namespace_name": "'"${GALAXY_NAMESPACE}"'",
              "github_reference": "${{ github.event.repository.default_branch }}",
              "github_repo": "${{ github.event.repository.name }}",
              "github_user": "${{ github.repository_owner }}"
            }'
