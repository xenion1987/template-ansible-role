---
- name: Converge
  hosts: all
  gather_facts: false

  pre_tasks:
    # The default images (geerlingguy/docker-*-ansible) already ship Python, so
    # this is a no-op there. It exists so the scenario also works against plain
    # distro images, which have no interpreter for the setup module to use -
    # hence raw, and hence gather_facts: false until it has run.
    - name: PRE_TASK | Install python3
      changed_when: false
      ansible.builtin.raw: |-
        sh -ec '
          command -v python3 >/dev/null 2>&1 && exit 0
          if command -v apt >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt update
            apt -y --no-install-recommends install python3
          elif command -v dnf >/dev/null 2>&1; then
            dnf makecache
            dnf -y install python3
          elif command -v yum >/dev/null 2>&1; then
            yum makecache
            yum -y install python3
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache --update python3
          fi
        '
    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
